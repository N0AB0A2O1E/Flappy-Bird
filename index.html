<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi</title>
    <style>
      :root {
        --bg: #0d47a1;
        --panel: #1e88e5;
        --particle: #87cefa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg) 0%, #0a2f6b 100%);
        font-family: Arial, Helvetica, sans-serif;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .particle {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(135, 206, 250, 0.95);
        box-shadow: 0 0 16px rgba(135, 206, 250, 0.8);
        animation: drift 8s ease-in-out infinite;
        opacity: 0.8;
      }

      .particle:nth-child(1) { left: 8%; top: 80%; animation-duration: 9s; }
      .particle:nth-child(2) { left: 18%; top: 20%; animation-duration: 7s; }
      .particle:nth-child(3) { left: 30%; top: 60%; animation-duration: 10s; }
      .particle:nth-child(4) { left: 42%; top: 15%; animation-duration: 8s; }
      .particle:nth-child(5) { left: 58%; top: 75%; animation-duration: 11s; }
      .particle:nth-child(6) { left: 70%; top: 25%; animation-duration: 6s; }
      .particle:nth-child(7) { left: 82%; top: 65%; animation-duration: 9s; }
      .particle:nth-child(8) { left: 92%; top: 35%; animation-duration: 7s; }
      .particle:nth-child(9) { left: 12%; top: 40%; animation-duration: 8s; }
      .particle:nth-child(10) { left: 38%; top: 85%; animation-duration: 10s; }
      .particle:nth-child(11) { left: 64%; top: 10%; animation-duration: 9s; }
      .particle:nth-child(12) { left: 88%; top: 82%; animation-duration: 6s; }

      .greeting {
        position: relative;
        z-index: 2;
        margin: 0;
        font-size: clamp(5rem, 18vw, 10rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: white;
        text-shadow: 0 0 24px rgba(255, 255, 255, 0.25);
        animation: pulse 2.4s ease-in-out infinite;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      @keyframes drift {
        0%, 100% {
          transform: translate3d(0, 0, 0) scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: translate3d(0, -120px, 0) scale(1.2);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

    </style>
  </head>
  <body>
    <div class="scene">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h1 id="greeting" class="greeting">Hi</h1>
      </div>
    </div>

    <script>
      const greeting = document.getElementById('greeting');
      let showingHi = true;

      setInterval(() => {
        greeting.style.opacity = '0';
        greeting.style.transform = 'scale(0.9)';

        setTimeout(() => {
          greeting.textContent = showingHi ? 'Bye' : 'Hi';
          showingHi = !showingHi;
          greeting.style.opacity = '1';
          greeting.style.transform = 'scale(1)';
        }, 180);
      }, 3000);
    </script>
  </body>
</html>
