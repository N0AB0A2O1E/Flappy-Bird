<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickman Tower Defence</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101926;
      color: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .game-wrap {
      width: min(1200px, 100%);
      display: flex;
      gap: 22px;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar {
      width: 320px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .sidebar h2 {
      margin: 0;
      color: #f8fafc;
      font-size: 1.25rem;
      letter-spacing: 0.03em;
    }

    .unit-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .unit-card {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: grab;
      user-select: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .unit-card:active {
      transform: scale(0.98);
      cursor: grabbing;
    }

    .unit-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #ffffff;
      text-align: center;
      padding: 5px;
      gap: 2px;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%) !important;
    }

    .unit-icon svg {
      width: 100%;
      height: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    .unit-icon span {
      display: block;
      width: 100%;
    }

    .unit-icon-weapon {
      font-size: 24px;
    }

    .unit-icon-face {
      font-size: 16px;
    }

    .unit-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.86rem;
    }

    .unit-details strong {
      font-size: 0.96rem;
      color: #f8fafc;
    }

    .unit-cost {
      font-size: 0.86rem;
      color: #cbd5e1;
    }

    .unit-availability {
      font-size: 0.78rem;
      color: #8be2ff;
      margin-top: 4px;
    }

    .unit-card.unaffordable {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }

    .unit-card.unaffordable .unit-availability {
      color: #fda4af;
    }

    .unit-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      color: #94a3b8;
      font-size: 0.76rem;
    }

    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    canvas {
      width: 100%;
      max-width: 860px;
      aspect-ratio: 860 / 520;
      border: 3px solid #4a8bff;
      border-radius: 18px;
      background: linear-gradient(180deg, #1f2b48 0%, #0f1727 100%);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      touch-action: none;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .info div {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 14px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      font-size: 0.96rem;
      color: #e2e8f0;
    }

    .info label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    #messageText {
      min-height: 46px;
    }

    #dragPreview {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: none;
      width: 140px;
      border-radius: 18px;
      padding: 10px;
      color: #fff;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      background: rgba(15, 23, 42, 0.96);
      line-height: 1.2;
    }

    .unit-tip {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .upgrade-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .upgrade-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(56, 189, 248, 0.18);
      color: #f8fafc;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .upgrade-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.28);
      transform: translateY(-1px);
    }

    .upgrade-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="sidebar">
      <h2>Stickman Roster</h2>
      <div id="unitBox" class="unit-box"></div>
      <div class="unit-tip">Drag a unit into the left zone. The CPU builds its own team from the right side.</div>
      <div class="upgrade-controls">
        <button id="weaponUpgradeButton" class="upgrade-btn">Upgrade Weapons ($150)</button>
      </div>
    </div>

    <div class="canvas-area">
      <canvas id="game" width="860" height="520"></canvas>
      <div class="info">
        <div>
          <label>Wave</label>
          <div id="waveText">1</div>
        </div>
        <div>
          <label>Money</label>
          <div id="moneyText">100</div>
        </div>
        <div>
          <label>CPU Money</label>
          <div id="cpuMoneyText">90</div>
        </div>
        <div>
          <label>Status</label>
          <div id="messageText">Drag a unit to deploy to the battlefield.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="dragPreview"></div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const DEPLOY_ZONE_WIDTH = 240;
    const CPU_ZONE_START = WIDTH - DEPLOY_ZONE_WIDTH;
    const MAX_LIVES = 1;
    const TEAM_PLAYER = 'player';
    const TEAM_CPU = 'cpu';
    const PLAYER_INCOME = 50;
    const CPU_INCOME = 45;
    const UNIT_ATTACK_COOLDOWN = 5000;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(frequency, duration = 0.1, type = 'sine', volume = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.value = volume;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    }
    function playEventSound(name) {
      switch (name) {
        case 'deploy': return playSound(420, 0.08, 'triangle', 0.15);
        case 'cpuDeploy': return playSound(520, 0.08, 'square', 0.14);
        case 'hit': return playSound(260, 0.04, 'sawtooth', 0.08);
        case 'tower': return playSound(660, 0.05, 'triangle', 0.1);
        case 'breach': return playSound(180, 0.18, 'sine', 0.14);
        case 'win': return playSound(880, 0.18, 'triangle', 0.16);
        case 'lose': return playSound(90, 0.2, 'sine', 0.16);
        default: return playSound(440, 0.06, 'square', 0.1);
      }
    }

    const stickmanTypes = [
      { id: 1, name: 'Wizard', icon: '🧙', face: '😄', cost: 440, range: 180, fireRate: 640, damage: 28, health: 110, color: '#8b5cf6' },
      { id: 2, name: 'Sniper', icon: '🎯', face: '😎', cost: 460, range: 280, fireRate: 700, damage: 250, health: 80, color: '#06b6d4' },
      { id: 3, name: 'Machinegunner', icon: '💥', face: '😠', cost: 425, range: 100, fireRate: 24, damage: 10, health: 120, color: '#fb923c' },
      { id: 4, name: 'Puncher', icon: '🥊', face: '😤', cost: 400, range: 80, fireRate: 585, damage: 46, health: 130, color: '#ef4444' },
      { id: 5, name: 'Ninja', icon: '🥷', face: '😶', cost: 430, range: 145, fireRate: 550, damage: 22, health: 90, color: '#0f172a' },
      { id: 6, name: 'Swordsman', icon: '⚔️', face: '😐', cost: 410, range: 130, fireRate: 572, damage: 26, health: 100, color: '#a855f7' },
      { id: 7, name: 'Archer', icon: '🏹', face: '🙂', cost: 395, range: 210, fireRate: 568, damage: 22, health: 90, color: '#22c55e' },
      { id: 8, name: 'Lightsaber', icon: '🔦', face: '😈', cost: 470, range: 165, fireRate: 560, damage: 34, health: 95, color: '#38bdf8' },
    ];

    const state = {
      towers: [
        { x: 80, y: HEIGHT / 2 - 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'Left Tower', color: '#06d6a0', team: TEAM_PLAYER },
        { x: 80, y: HEIGHT / 2 + 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'Middle Tower', color: '#06a6ff', team: TEAM_PLAYER },
        { x: 220, y: HEIGHT / 2 + 20, range: 240, fireRate: 70, cooldown: 0, health: 5000, maxHealth: 5000, base: true, label: 'Core Tower', color: '#0ea5e9', team: TEAM_PLAYER },
        { x: WIDTH - 80, y: HEIGHT / 2 - 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'CPU Left Tower', color: '#fb7185', team: TEAM_CPU },
        { x: WIDTH - 80, y: HEIGHT / 2 + 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'CPU Middle Tower', color: '#f97316', team: TEAM_CPU },
        { x: WIDTH - 220, y: HEIGHT / 2 + 20, range: 240, fireRate: 70, cooldown: 0, health: 5000, maxHealth: 5000, base: true, label: 'CPU Core', color: '#fb7185', team: TEAM_CPU },
      ],
      playerUnits: [],
      cpuUnits: [],
      bullets: [],
      money: 240,
      moneyFloat: 240,
      cpuMoney: 210,
      cpuMoneyFloat: 210,
      lives: MAX_LIVES,
      wave: 1,
      cpuUnitsLeft: 10,
      cpuDeployTimer: 1600,
      weaponUpgradeLevel: 0,
      weaponUpgradeCost: 150,
      gameOver: false,
      message: 'Drag a unit to deploy to the battlefield.',
      spawnCooldowns: {},
    };

    let dragState = null;
    let lastTimestamp = 0;

    const unitBox = document.getElementById('unitBox');
    const dragPreview = document.getElementById('dragPreview');
    const waveText = document.getElementById('waveText');
    const moneyText = document.getElementById('moneyText');
    const cpuMoneyText = document.getElementById('cpuMoneyText');
    const messageText = document.getElementById('messageText');
    const weaponUpgradeButton = document.getElementById('weaponUpgradeButton');

    function updateWeaponUpgradeButton() {
      weaponUpgradeButton.textContent = `Upgrade Weapons (Lvl ${state.weaponUpgradeLevel}) - $${state.weaponUpgradeCost}`;
      weaponUpgradeButton.disabled = state.money < state.weaponUpgradeCost || state.gameOver;
    }

    function applyWeaponUpgrade() {
      const multiplier = 1 + state.weaponUpgradeLevel * 0.15;
      state.playerUnits.forEach((unit) => {
        unit.damage = Math.round(unit.baseDamage * multiplier);
      });
    }

    function upgradeWeapons() {
      if (state.money < state.weaponUpgradeCost) {
        state.message = 'Not enough money to upgrade weapons.';
        return;
      }
      state.money -= state.weaponUpgradeCost;
      state.moneyFloat -= state.weaponUpgradeCost;
      state.weaponUpgradeLevel += 1;
      state.weaponUpgradeCost = 150 + state.weaponUpgradeLevel * 100;
      state.message = `Weapons upgraded to level ${state.weaponUpgradeLevel}!`;
      applyWeaponUpgrade();
      updateWeaponUpgradeButton();
    }

    function drawUnitSVG(type) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 80 80');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.3))';

      const headY = 20, neckY = 28, hipY = 44, footY = 56;
      const armSwing = 6, legSwing = 4;

      // Head
      const head = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      head.setAttribute('cx', '40');
      head.setAttribute('cy', headY);
      head.setAttribute('r', '8');
      head.setAttribute('fill', type.color);
      head.setAttribute('stroke', '#082032');
      head.setAttribute('stroke-width', '1.5');
      svg.appendChild(head);

      // Body
      const body = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      body.setAttribute('x1', '40');
      body.setAttribute('y1', neckY);
      body.setAttribute('x2', '40');
      body.setAttribute('y2', hipY);
      body.setAttribute('stroke', type.color);
      body.setAttribute('stroke-width', '2');
      svg.appendChild(body);

      // Arms
      const armL = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      armL.setAttribute('x1', '40');
      armL.setAttribute('y1', '32');
      armL.setAttribute('x2', 40 - armSwing);
      armL.setAttribute('y2', '42');
      armL.setAttribute('stroke', type.color);
      armL.setAttribute('stroke-width', '1.5');
      svg.appendChild(armL);

      const armR = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      armR.setAttribute('x1', '40');
      armR.setAttribute('y1', '32');
      armR.setAttribute('x2', 40 + armSwing);
      armR.setAttribute('y2', '42');
      armR.setAttribute('stroke', type.color);
      armR.setAttribute('stroke-width', '1.5');
      svg.appendChild(armR);

      // Legs
      const legL = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      legL.setAttribute('x1', '40');
      legL.setAttribute('y1', hipY);
      legL.setAttribute('x2', 40 - legSwing);
      legL.setAttribute('y2', footY);
      legL.setAttribute('stroke', type.color);
      legL.setAttribute('stroke-width', '1.5');
      svg.appendChild(legL);

      const legR = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      legR.setAttribute('x1', '40');
      legR.setAttribute('y1', hipY);
      legR.setAttribute('x2', 40 + legSwing);
      legR.setAttribute('y2', footY);
      legR.setAttribute('stroke', type.color);
      legR.setAttribute('stroke-width', '1.5');
      svg.appendChild(legR);

      // Weapon
      switch (type.id) {
        case 1: // Wizard - staff with orb
          {
            const staff = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            staff.setAttribute('x1', '48');
            staff.setAttribute('y1', '42');
            staff.setAttribute('x2', '62');
            staff.setAttribute('y2', '28');
            staff.setAttribute('stroke', '#fbbf24');
            staff.setAttribute('stroke-width', '2');
            svg.appendChild(staff);

            const orb = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            orb.setAttribute('cx', '64');
            orb.setAttribute('cy', '26');
            orb.setAttribute('r', '4');
            orb.setAttribute('fill', '#a78bfa');
            orb.setAttribute('stroke', '#fbbf24');
            orb.setAttribute('stroke-width', '1');
            svg.appendChild(orb);
          }
          break;
        case 2: // Sniper - rifle
          {
            const rifle = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            rifle.setAttribute('x1', '48');
            rifle.setAttribute('y1', '42');
            rifle.setAttribute('x2', '68');
            rifle.setAttribute('y2', '32');
            rifle.setAttribute('stroke', '#64748b');
            rifle.setAttribute('stroke-width', '3');
            svg.appendChild(rifle);

            const scope = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            scope.setAttribute('cx', '58');
            scope.setAttribute('cy', '35');
            scope.setAttribute('r', '3');
            scope.setAttribute('fill', 'none');
            scope.setAttribute('stroke', '#94a3b8');
            scope.setAttribute('stroke-width', '1');
            svg.appendChild(scope);
          }
          break;
        case 3: // Machinegunner - gun
          {
            const gun = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            gun.setAttribute('x', '48');
            gun.setAttribute('y', '38');
            gun.setAttribute('width', '16');
            gun.setAttribute('height', '5');
            gun.setAttribute('fill', '#64748b');
            gun.setAttribute('stroke', '#475569');
            gun.setAttribute('stroke-width', '1');
            svg.appendChild(gun);
          }
          break;
        case 4: // Puncher - gloves
          {
            const glove1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            glove1.setAttribute('cx', '32');
            glove1.setAttribute('cy', '36');
            glove1.setAttribute('r', '4');
            glove1.setAttribute('fill', '#dc2626');
            glove1.setAttribute('stroke', '#991b1b');
            glove1.setAttribute('stroke-width', '1');
            svg.appendChild(glove1);

            const glove2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            glove2.setAttribute('cx', '48');
            glove2.setAttribute('cy', '36');
            glove2.setAttribute('r', '4');
            glove2.setAttribute('fill', '#dc2626');
            glove2.setAttribute('stroke', '#991b1b');
            glove2.setAttribute('stroke-width', '1');
            svg.appendChild(glove2);
          }
          break;
        case 5: // Ninja - blade
          {
            const blade = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            blade.setAttribute('x1', '48');
            blade.setAttribute('y1', '42');
            blade.setAttribute('x2', '62');
            blade.setAttribute('y2', '28');
            blade.setAttribute('stroke', '#1f2937');
            blade.setAttribute('stroke-width', '2.5');
            svg.appendChild(blade);
          }
          break;
        case 6: // Swordsman - sword
          {
            const sword = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            sword.setAttribute('x1', '48');
            sword.setAttribute('y1', '42');
            sword.setAttribute('x2', '64');
            sword.setAttribute('y2', '26');
            sword.setAttribute('stroke', '#f59e0b');
            sword.setAttribute('stroke-width', '3');
            svg.appendChild(sword);

            const guard = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            guard.setAttribute('cx', '48');
            guard.setAttribute('cy', '42');
            guard.setAttribute('r', '3');
            guard.setAttribute('fill', '#b45309');
            svg.appendChild(guard);
          }
          break;
        case 7: // Archer - bow
          {
            const bowStave = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            bowStave.setAttribute('x1', '48');
            bowStave.setAttribute('y1', '30');
            bowStave.setAttribute('x2', '48');
            bowStave.setAttribute('y2', '52');
            bowStave.setAttribute('stroke', '#92400e');
            bowStave.setAttribute('stroke-width', '2');
            svg.appendChild(bowStave);

            const bowString = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            bowString.setAttribute('d', 'M 52 32 Q 58 42 52 50');
            bowString.setAttribute('fill', 'none');
            bowString.setAttribute('stroke', '#f5deb3');
            bowString.setAttribute('stroke-width', '1.5');
            svg.appendChild(bowString);

            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            arrow.setAttribute('x1', '52');
            arrow.setAttribute('y1', '42');
            arrow.setAttribute('x2', '65');
            arrow.setAttribute('y2', '42');
            arrow.setAttribute('stroke', '#22c55e');
            arrow.setAttribute('stroke-width', '1.5');
            svg.appendChild(arrow);
          }
          break;
        case 8: // Lightsaber
          {
            const saber = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            saber.setAttribute('x1', '48');
            saber.setAttribute('y1', '42');
            saber.setAttribute('x2', '62');
            saber.setAttribute('y2', '26');
            saber.setAttribute('stroke', '#38bdf8');
            saber.setAttribute('stroke-width', '4');
            saber.setAttribute('stroke-linecap', 'round');
            svg.appendChild(saber);

            const glow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            glow.setAttribute('x1', '48');
            glow.setAttribute('y1', '42');
            glow.setAttribute('x2', '62');
            glow.setAttribute('y2', '26');
            glow.setAttribute('stroke', '#8ecae6');
            glow.setAttribute('stroke-width', '2');
            glow.setAttribute('opacity', '0.6');
            svg.appendChild(glow);
          }
          break;
      }

      return svg;
    }

    function createUnitCard(type) {
      const card = document.createElement('div');
      card.className = 'unit-card';
      card.dataset.unitId = type.id;
      card.dataset.cost = type.cost;

      const icon = document.createElement('div');
      icon.className = 'unit-icon';
      icon.style.background = 'rgba(255, 255, 255, 0.08)';
      icon.style.border = '1px solid rgba(255, 255, 255, 0.14)';
      icon.appendChild(drawUnitSVG(type));

      const details = document.createElement('div');
      details.className = 'unit-details';
      const attackSpeed = (1000 / type.fireRate).toFixed(1);
      const reloadTime = (type.fireRate / 1000).toFixed(2);
      const dps = (type.damage * 1000 / type.fireRate).toFixed(1);
      details.innerHTML = `
        <div><strong>${type.name}</strong></div>
        <div class="unit-cost">Price: ${type.cost}</div>
        <div class="unit-availability"></div>
        <div class="unit-stats">
          <span>DMG:${type.damage}</span>
          <span>HP:${type.health}</span>
          <span>ATK/s:${attackSpeed}</span>
          <span>DPS:${dps}</span>
          <span>RL:${reloadTime}s</span>
        </div>
      `;

      card.append(icon, details);
      card.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const cooldown = state.spawnCooldowns[type.id] || 0;
        if (cooldown > 0) {
          state.message = `${type.name} is on cooldown for ${(cooldown / 1000).toFixed(1)}s.`;
          return;
        }
        if (state.money < type.cost) {
          state.message = 'Not enough money for that unit.';
          return;
        }
        dragState = { type };
        dragPreview.style.display = 'block';
        dragPreview.textContent = `${type.name} - $${type.cost}`;
        updateDragPreviewPosition(event.clientX, event.clientY);
      });

      return card;
    }

    function populateUnitBox() {
      stickmanTypes.forEach((type) => unitBox.appendChild(createUnitCard(type)));
      updateUnitCardAvailability();
      updateWeaponUpgradeButton();
    }

    function updateUnitCardAvailability() {
      document.querySelectorAll('.unit-card').forEach((card) => {
        const typeId = Number(card.dataset.unitId);
        const cost = Number(card.dataset.cost);
        const cooldown = state.spawnCooldowns[typeId] || 0;
        const canAfford = cost <= state.money;
        const available = canAfford && cooldown <= 0;
        card.classList.toggle('unaffordable', !available);
        const availability = card.querySelector('.unit-availability');
        if (availability) {
          if (cooldown > 0) {
            availability.textContent = `Cooldown: ${(cooldown / 1000).toFixed(1)}s`;
          } else if (!canAfford) {
            availability.textContent = 'Too expensive';
          } else {
            availability.textContent = 'Available';
          }
        }
      });
    }

    function updateDragPreviewPosition(pageX, pageY) {
      dragPreview.style.left = `${pageX + 12}px`;
      dragPreview.style.top = `${pageY + 12}px`;
    }

    function resetGame() {
      state.towers = [
        { x: 80, y: HEIGHT / 2 - 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'Left Tower', color: '#06d6a0', team: TEAM_PLAYER },
        { x: 80, y: HEIGHT / 2 + 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'Middle Tower', color: '#06a6ff', team: TEAM_PLAYER },
        { x: 220, y: HEIGHT / 2 + 20, range: 240, fireRate: 70, cooldown: 0, health: 5000, maxHealth: 5000, base: true, label: 'Core Tower', color: '#0ea5e9', team: TEAM_PLAYER },
        { x: WIDTH - 80, y: HEIGHT / 2 - 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'CPU Left Tower', color: '#fb7185', team: TEAM_CPU },
        { x: WIDTH - 80, y: HEIGHT / 2 + 80, range: 240, fireRate: 85, cooldown: 0, health: 1000, maxHealth: 1000, base: false, label: 'CPU Middle Tower', color: '#f97316', team: TEAM_CPU },
        { x: WIDTH - 220, y: HEIGHT / 2 + 20, range: 240, fireRate: 70, cooldown: 0, health: 5000, maxHealth: 5000, base: true, label: 'CPU Core', color: '#fb7185', team: TEAM_CPU },
      ];
      state.playerUnits = [];
      state.cpuUnits = [];
      state.bullets = [];
      state.money = 240;
      state.moneyFloat = 240;
      state.cpuMoney = 210;
      state.cpuMoneyFloat = 210;
      state.lives = MAX_LIVES;
      state.wave = 1;
      state.cpuUnitsLeft = 10;
      state.cpuDeployTimer = 1600;
      state.gameOver = false;
      state.message = 'Drag a unit to deploy to the battlefield.';
    }

    function deployPlayerUnit(x, y, type) {
      const positionY = Math.max(36, Math.min(HEIGHT - 36, y));
      const damageMultiplier = 1 + state.weaponUpgradeLevel * 0.15;
      state.playerUnits.push({
        x,
        y: positionY,
        speed: 1.2 + state.wave * 0.035,
        walkPhase: Math.random() * Math.PI * 2,
        range: type.range,
        fireRate: type.fireRate,
        attackCooldown: type.fireRate,
        cooldown: 0,
        attackTimer: 0,
        health: type.health * 10,
        maxHealth: type.health * 10,
        label: type.name,
        color: type.color,
        team: TEAM_PLAYER,
        damage: Math.round(type.damage * damageMultiplier),
        baseDamage: type.damage,
        weaponType: type.id,
      });
      state.money -= type.cost;
      state.moneyFloat -= type.cost;
      state.spawnCooldowns[type.id] = type.fireRate;
      state.message = `${type.name} deployed to the left flank!`;
      playEventSound('deploy');
    }

    function createCpuUnit(type) {
      const y = 36 + Math.random() * (HEIGHT - 72);
      return {
        x: WIDTH + 32,
        y,
        speed: -1.3 - state.wave * 0.04,
        walkPhase: Math.random() * Math.PI * 2,
        range: type.range,
        fireRate: type.fireRate,
        attackCooldown: type.fireRate,
        cooldown: 0,
        attackTimer: 0,
        health: type.health * 10,
        maxHealth: type.health * 10,
        damage: type.damage,
        baseDamage: type.damage,
        label: type.name,
        color: type.color,
        team: TEAM_CPU,
        weaponType: type.id,
      };
    }

    function chooseCpuUnit() {
      const affordable = stickmanTypes.filter((type) => type.cost <= state.cpuMoney);
      if (affordable.length === 0) return null;
      affordable.sort((a, b) => a.cost - b.cost);
      if (Math.random() < 0.25) {
        return affordable[affordable.length - 1];
      }
      return affordable[Math.floor(Math.random() * affordable.length)];
    }

    function isMouseOverCanvas(event, rect) {
      return event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
    }

    document.addEventListener('pointermove', (event) => {
      if (!dragState) return;
      updateDragPreviewPosition(event.clientX, event.clientY);
    });

    document.addEventListener('pointerup', (event) => {
      if (!dragState) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      if (isMouseOverCanvas(event, rect)) {
        if (x > DEPLOY_ZONE_WIDTH) {
          state.message = 'Drop inside the left zone to deploy units.';
        } else if (state.money < dragState.type.cost) {
          state.message = 'Not enough money for that unit.';
        } else {
          deployPlayerUnit(x, y, dragState.type);
        }
      } else {
        state.message = 'Drop a unit onto the battlefield.';
      }
      dragState = null;
      dragPreview.style.display = 'none';
    });

    weaponUpgradeButton.addEventListener('click', upgradeWeapons);

    canvas.addEventListener('click', () => {
      if (state.gameOver) resetGame();
    });

    function drawStickman(x, y, scale = 1, color = '#ffffff', bob = 0, phase = 0, isAttacking = false, attackPct = 0) {
      const headY = y - 14 * scale + bob;
      const neckY = y - 6 * scale + bob;
      const hipY = y + 14 * scale + bob;
      const footY = y + 24 * scale + bob;

      // Enhanced walking animation with more pronounced movement
      const legSwing = Math.sin(phase) * 12 * scale;
      const bobWalk = Math.sin(phase * 2) * 2 * scale;
      const headBob = headY + bobWalk;

      // Attacking animation - arm extends forward during attack
      let armSwing = Math.cos(phase) * 8 * scale;
      if (isAttacking) {
        armSwing = Math.cos(phase) * 4 * scale;
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.arc(x, headBob, 8 * scale, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x, neckY + bobWalk);
      ctx.lineTo(x, hipY);
      ctx.stroke();

      // Attacking arm extension
      let leftArmX = x - armSwing;
      let leftArmY = y + 10 * scale + bob;
      let rightArmX = x + armSwing;
      let rightArmY = y + 10 * scale + bob;

      if (isAttacking) {
        rightArmX += 14 * attackPct;
        rightArmY -= 6 * attackPct;
      }

      ctx.beginPath();
      ctx.moveTo(x, y + 2 * scale + bob);
      ctx.lineTo(leftArmX, leftArmY);
      ctx.moveTo(x, y + 2 * scale + bob);
      ctx.lineTo(rightArmX, rightArmY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x, hipY);
      ctx.lineTo(x - legSwing, footY);
      ctx.moveTo(x, hipY);
      ctx.lineTo(x + legSwing, footY);
      ctx.stroke();
    }

    function drawWeapon(unit, x, y, bob = 0, phase = 0) {
      const scale = 1;
      const direction = unit.team === TEAM_PLAYER ? 1 : -1;
      const attackPct = Math.max(0, unit.attackTimer) / 200;
      const weaponExtend = 14 * attackPct;

      // Hand position follows arm swing during walking
      const armSwing = Math.cos(phase) * 8 * scale;
      const handX = x + (8 + armSwing * 0.5) * direction * scale;
      const handY = y + 10 * scale + bob;

      // Weapon extends forward during attack
      const attackLiftY = -6 * attackPct;
      const endX = handX + (16 + weaponExtend) * direction;
      const endY = handY - 4 * scale;

      const endX = handX + (16 + weaponExtend) * direction;
      const endY = handY - 4 * scale + attackLiftY;

      switch (unit.weaponType) {
        case 1: // Wizard staff - yellow staff with purple orb
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2.5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.fillStyle = '#a78bfa';
          ctx.beginPath();
          ctx.arc(endX, endY, 5 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 1 * scale;
          ctx.stroke();
          break;

        case 2: // Sniper rifle - gray with scope
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 3.5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1.5 * scale;
          ctx.beginPath();
          ctx.arc((handX + endX) / 2, (handY + endY) / 2, 4 * scale, 0, Math.PI * 2);
          ctx.stroke();
          break;

        case 3: // Machinegunner - gray rectangular gun
          ctx.fillStyle = '#64748b';
          ctx.fillRect(handX + direction * 2 * scale, handY - 4 * scale, (18 + weaponExtend * 0.7) * scale * direction, 8 * scale);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1 * scale;
          ctx.strokeRect(handX + direction * 2 * scale, handY - 4 * scale, (18 + weaponExtend * 0.7) * scale * direction, 8 * scale);
          break;

        case 4: // Puncher - red gloves with extension during attack
          const punchExtend = 6 * attackPct;
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.arc(handX - direction * (8 + punchExtend) * scale, handY - 8 * scale, 6 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#991b1b';
          ctx.lineWidth = 1.5 * scale;
          ctx.stroke();
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.arc(handX + direction * (8 + punchExtend) * scale, handY - 8 * scale, 6 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#991b1b';
          ctx.lineWidth = 1.5 * scale;
          ctx.stroke();
          break;

        case 5: // Ninja blade - dark black blade
          ctx.strokeStyle = '#1f2937';
          ctx.lineWidth = 3.5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          break;

        case 6: // Swordsman - gold sword with brown guard
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3.5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.fillStyle = '#b45309';
          ctx.beginPath();
          ctx.arc(handX, handY, 4 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 1.5 * scale;
          ctx.stroke();
          break;

        case 7: // Archer - brown bow with green arrow
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 2.5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY - 10 * scale);
          ctx.quadraticCurveTo(handX + direction * 8 * scale, handY, handX, handY + 10 * scale);
          ctx.stroke();
          ctx.strokeStyle = '#f5deb3';
          ctx.lineWidth = 1.5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX - direction * 2 * scale, handY);
          ctx.lineTo(handX + direction * 8 * scale, handY);
          ctx.stroke();
          const arrowDraw = direction * (6 + weaponExtend * 0.8);
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 2 * scale;
          ctx.beginPath();
          ctx.moveTo(handX + direction * 8 * scale, handY - 1 * scale);
          ctx.lineTo(handX + arrowDraw, handY + attackLiftY);
          ctx.stroke();
          break;

        case 8: // Lightsaber - glowing blue blade
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15 + 10 * attackPct;
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 5 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#8ecae6';
          ctx.lineWidth = 2 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          break;

        default:
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2 * scale;
          ctx.beginPath();
          ctx.moveTo(handX, handY);
          ctx.lineTo(endX, endY);
          ctx.stroke();
      }
    }

    function drawTower(unit) {
      const size = unit.base ? 52 : 36;
      const pulse = unit.pulse ? Math.sin(unit.pulse) * 3 : 0;
      ctx.fillStyle = unit.color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = unit.base ? 3 : 2;
      ctx.beginPath();
      ctx.arc(unit.x, unit.y - 12 + pulse, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      drawStickman(unit.x, unit.y + pulse, unit.base ? 1.2 : 0.88, '#082032', 0, 0, false, 0);
      if (unit.base) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(unit.label, unit.x, unit.y + size / 2 + 16);
        const attackSpeed = (1000 / unit.fireRate).toFixed(1);
        const reloadTime = (unit.fireRate / 1000).toFixed(2);
        const dps = (14 * 1000 / unit.fireRate).toFixed(1);
        ctx.font = '11px Arial';
        ctx.fillText(`FR:${attackSpeed}/s`, unit.x, unit.y - size / 2 - 10 + pulse);
        ctx.fillText(`DPS:${dps}`, unit.x, unit.y - size / 2 + 4 + pulse);
        ctx.fillText(`RL:${reloadTime}s`, unit.x, unit.y - size / 2 + 18 + pulse);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Arial';
        ctx.fillText(`${Math.max(0, Math.floor(unit.health))} HP`, unit.x, unit.y + size / 2 + 30);
      }
      const healthWidth = unit.base ? 88 : 58;
      const healthHeight = 8;
      const healthPct = Math.max(0, unit.health / unit.maxHealth);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(unit.x - healthWidth / 2, unit.y + size / 2 + 6, healthWidth, healthHeight);
      ctx.fillStyle = unit.team === TEAM_PLAYER ? '#22c55e' : '#fb7185';
      ctx.fillRect(unit.x - healthWidth / 2, unit.y + size / 2 + 6, healthWidth * healthPct, healthHeight);
    }

    function drawUnit(unit) {
      const bob = Math.sin(unit.walkPhase || 0) * 3;
      const phase = unit.walkPhase || 0;
      const isAttacking = unit.attackTimer > 0;
      const attackPct = Math.max(0, unit.attackTimer) / 200;
      drawStickman(unit.x, unit.y, 1, unit.color, bob, phase, isAttacking, attackPct);
      drawWeapon(unit, unit.x, unit.y, bob, phase);
      const healthWidth = 32;
      const healthHeight = 6;
      const healthPct = Math.max(0, unit.health / unit.maxHealth);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(unit.x - healthWidth / 2, unit.y - 36 + bob, healthWidth, healthHeight);
      ctx.fillStyle = unit.team === TEAM_PLAYER ? '#22c55e' : '#fb7185';
      ctx.fillRect(unit.x - healthWidth / 2, unit.y - 36 + bob, healthWidth * healthPct, healthHeight);
    }

    function drawBullet(bullet) {
      ctx.fillStyle = bullet.team === TEAM_PLAYER ? '#8ecae6' : '#fda4af';
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateCpuDeployment(delta) {
      state.cpuMoneyFloat += CPU_INCOME * delta / 1000;
      state.cpuMoney = Math.floor(state.cpuMoneyFloat);
      if (state.cpuUnitsLeft > 0) {
        state.cpuDeployTimer -= delta;
        if (state.cpuDeployTimer <= 0) {
          const cpuType = chooseCpuUnit();
          if (cpuType) {
            state.cpuUnits.push(createCpuUnit(cpuType));
            state.cpuMoney -= cpuType.cost;
            state.cpuMoneyFloat -= cpuType.cost;
            state.cpuUnitsLeft -= 1;
            state.message = `CPU deployed ${cpuType.name}!`;
          }
          state.cpuDeployTimer = 1400;
        }
      }
    }

    function findNearestEnemy(source, targets) {
      let best = null;
      let bestDist = Infinity;
      targets.forEach((target) => {
        if (target.health <= 0) return;
        const dist = Math.hypot(source.x - target.x, source.y - target.y);
        if (dist < bestDist) {
          bestDist = dist;
          best = target;
        }
      });
      return { target: best, distance: bestDist };
    }

    function getEnemyTargets(team) {
      return team === TEAM_PLAYER
        ? state.cpuUnits.concat(state.towers.filter((tower) => tower.team === TEAM_CPU && tower.health > 0))
        : state.playerUnits.concat(state.towers.filter((tower) => tower.team === TEAM_PLAYER && tower.health > 0));
    }

    function getEnemyTowerTargets(team) {
      return team === TEAM_PLAYER
        ? state.towers.filter((tower) => tower.team === TEAM_CPU && tower.health > 0)
        : state.towers.filter((tower) => tower.team === TEAM_PLAYER && tower.health > 0);
    }

    function findNearestEnemyPreferTowers(source, team) {
      const units = team === TEAM_PLAYER ? state.cpuUnits.filter((unit) => unit.health > 0) : state.playerUnits.filter((unit) => unit.health > 0);
      const unitTarget = findNearestEnemy(source, units).target;
      if (unitTarget) {
        return { target: unitTarget, distance: Math.hypot(source.x - unitTarget.x, source.y - unitTarget.y) };
      }
      const towers = getEnemyTowerTargets(team).filter((tower) => tower.health > 0);
      return findNearestEnemy(source, towers);
    }

    function createBullet(sourceX, sourceY, target, team, damage, options = {}) {
      const dx = target.x - sourceX;
      const dy = target.y - sourceY;
      const distance = Math.hypot(dx, dy) || 1;
      const speed = 12;
      return {
        x: sourceX,
        y: sourceY,
        vx: dx / distance * speed,
        vy: dy / distance * speed,
        target,
        team,
        damage,
        isTowerBullet: Boolean(options.isTowerBullet),
      };
    }

    function moveUnitTowardTarget(unit, target) {
      if (!target) {
        unit.x += unit.speed;
        return;
      }
      const dx = target.x - unit.x;
      const dy = target.y - unit.y;
      const distance = Math.hypot(dx, dy);
      if (distance <= unit.range) return;
      const moveDist = Math.min(Math.abs(unit.speed), distance - unit.range);
      if (moveDist <= 0) return;
      unit.x += dx / distance * moveDist;
      unit.y += dy / distance * moveDist;
    }

    function update(delta) {
      if (state.gameOver) return;
      state.moneyFloat += PLAYER_INCOME * delta / 1000;
      state.money = Math.floor(state.moneyFloat);      Object.keys(state.spawnCooldowns).forEach((key) => {
        state.spawnCooldowns[key] -= delta;
        if (state.spawnCooldowns[key] < 0) state.spawnCooldowns[key] = 0;
      });      updateCpuDeployment(delta);

      state.playerUnits.forEach((unit) => {
        if (unit.health <= 0) return;
        unit.walkPhase += delta * 0.01;
        if (unit.cooldown > 0) unit.cooldown -= delta;
        if (unit.attackTimer > 0) unit.attackTimer -= delta;
        const { target } = findNearestEnemyPreferTowers(unit, TEAM_PLAYER);
        moveUnitTowardTarget(unit, target);
        unit.x = Math.min(unit.x, WIDTH - 22);
      });
      state.towers.forEach((tower) => {
        if (tower.cooldown > 0) tower.cooldown -= delta;
        if (tower.pulse !== undefined) tower.pulse += delta * 0.008;
      });
      state.cpuUnits.forEach((unit) => {
        if (unit.health <= 0) return;
        unit.walkPhase += delta * 0.01;
        if (unit.cooldown > 0) unit.cooldown -= delta;
        if (unit.attackTimer > 0) unit.attackTimer -= delta;
        const { target } = findNearestEnemyPreferTowers(unit, TEAM_CPU);
        moveUnitTowardTarget(unit, target);
        unit.x = Math.max(unit.x, 22);
      });

      state.cpuUnits.forEach((unit) => {
        if (unit.health <= 0) return;
        const { target, distance } = findNearestEnemyPreferTowers(unit, TEAM_CPU);
        if (!target) return;
        if (distance < 24 && unit.cooldown <= 0) {
          target.health -= unit.damage;
          unit.cooldown = unit.attackCooldown;
          unit.attackTimer = 200;
          state.message = `${unit.label} hit ${target.label || 'your unit'}!`;
          playEventSound('hit');
          if (target.health <= 0) {
            target.health = 0;
            state.message = `${target.label || 'Your unit'} was destroyed by CPU!`;
          }
        } else if (distance <= unit.range && unit.cooldown <= 0) {
          state.bullets.push(createBullet(unit.x - 16, unit.y - 6, target, TEAM_CPU, unit.damage));
          unit.cooldown = unit.attackCooldown;
          unit.attackTimer = 200;
          playEventSound('hit');
        }
      });

      state.playerUnits = state.playerUnits.filter((unit) => unit.health > 0);
      state.cpuUnits = state.cpuUnits.filter((unit) => unit.health > 0 && unit.x > -28);

      state.playerUnits.forEach((unit) => {
        if (unit.cooldown > 0) return;
        const { target, distance } = findNearestEnemyPreferTowers(unit, TEAM_PLAYER);
        if (!target) return;
        if (distance < 24) {
          target.health -= unit.damage;
          unit.cooldown = unit.attackCooldown;
          unit.attackTimer = 200;
          state.message = `${unit.label} hit ${target.label || 'CPU unit'}!`;
          playEventSound('hit');
          if (target.health <= 0) {
            target.health = 0;
            state.moneyFloat += 22;
            state.money = Math.floor(state.moneyFloat);
            state.message = `${target.label || 'CPU unit'} was destroyed!`;
          }
        } else if (distance <= unit.range) {
          state.bullets.push(createBullet(unit.x + 16, unit.y - 6, target, TEAM_PLAYER, unit.damage));
          unit.cooldown = unit.attackCooldown;
          unit.attackTimer = 200;
          playEventSound('tower');
        }
      });

      state.towers.forEach((tower) => {
        if (tower.cooldown > 0 || tower.health <= 0) return;
        const enemyTargets = tower.team === TEAM_PLAYER
          ? state.cpuUnits.concat(state.towers.filter((enemy) => enemy.team === TEAM_CPU && enemy.health > 0))
          : state.playerUnits.concat(state.towers.filter((enemy) => enemy.team === TEAM_PLAYER && enemy.health > 0));
        const { target, distance } = findNearestEnemy(tower, enemyTargets);
        if (target && distance <= tower.range) {
          state.bullets.push(createBullet(tower.x + 14, tower.y - 10, target, tower.team, 14, { isTowerBullet: true }));
          tower.cooldown = tower.fireRate;
          playEventSound('tower');
        }
      });

      state.bullets.forEach((bullet) => {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
        if (bullet.target.health <= 0) {
          bullet.dead = true;
          return;
        }
        if (Math.hypot(bullet.x - bullet.target.x, bullet.y - bullet.target.y) < 12) {
          bullet.dead = true;
          const splashRadius = bullet.isTowerBullet ? 42 : 12;
          const hitTargets = state.towers.concat(state.playerUnits, state.cpuUnits).filter((target) => {
            if (target.health <= 0 || target.team === bullet.team) return false;
            return Math.hypot(bullet.x - target.x, bullet.y - target.y) <= splashRadius;
          });
          hitTargets.forEach((target) => {
            target.health -= bullet.damage;
            if (target.health <= 0) {
              target.health = 0;
              if (bullet.team === TEAM_PLAYER && target.team === TEAM_CPU) {
                state.moneyFloat += 22;
                state.money = Math.floor(state.moneyFloat);
                state.message = `${target.label} defeated by your team!`;
              }
            }
          });
        }
      });

      state.bullets = state.bullets.filter((bullet) => !bullet.dead && bullet.x >= -20 && bullet.x <= WIDTH + 20 && bullet.y >= -20 && bullet.y <= HEIGHT + 20);

      const cpuBaseBreaches = state.cpuUnits.filter((unit) => unit.x <= 0);
      cpuBaseBreaches.forEach((unit) => {
        unit.health = 0;
        state.lives -= 1;
        state.message = 'A CPU unit breached your base!';
      });

      if (state.cpuUnitsLeft <= 0 && state.cpuUnits.length === 0) {
        state.wave += 1;
        state.cpuUnitsLeft = 10 + state.wave * 2;
        state.cpuDeployTimer = 1400;
        state.message = 'Next Wave!';
      }

      const alivePlayerTowers = state.towers.filter((tower) => tower.team === TEAM_PLAYER && tower.health > 0).length;
      if (alivePlayerTowers === 0) {
        state.gameOver = true;
        state.message = 'All your towers have fallen! Game Over. Click the battlefield to restart.';
      }

      if (state.lives <= 0) {
        state.lives = 0;
        state.gameOver = true;
        state.message = 'Game Over! Click the battlefield to restart.';
      }

      waveText.textContent = `Wave: ${state.wave}`;
      moneyText.textContent = `Money: ${state.money}`;
      cpuMoneyText.textContent = `CPU Money: ${state.cpuMoney}`;
      messageText.textContent = state.message;
      updateUnitCardAvailability();
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = '#121b2f';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(0, 0, DEPLOY_ZONE_WIDTH, HEIGHT);
      ctx.fillStyle = 'rgba(255, 90, 120, 0.08)';
      ctx.fillRect(CPU_ZONE_START, 0, DEPLOY_ZONE_WIDTH, HEIGHT);
      ctx.fillStyle = '#a3d8ff';
      ctx.font = '16px Arial';
      ctx.fillText('Player Deploy Zone', 16, 30);
      ctx.fillText('CPU Build Zone', CPU_ZONE_START + 16, 30);
      ctx.strokeStyle = '#4c8bf5';
      ctx.lineWidth = 2;
      ctx.strokeRect(6, 6, DEPLOY_ZONE_WIDTH - 12, HEIGHT - 12);
      ctx.strokeStyle = '#fda4af';
      ctx.strokeRect(CPU_ZONE_START + 6, 6, DEPLOY_ZONE_WIDTH - 12, HEIGHT - 12);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, WIDTH - 4, HEIGHT - 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(12, 12, WIDTH - 24, HEIGHT - 24);
      ctx.fillStyle = '#caf0f8';
      ctx.font = '20px Arial';
      ctx.fillText(`Income: ${PLAYER_INCOME} / sec`, 14, 48);
      ctx.fillText(`CPU Income: ${CPU_INCOME} / sec`, CPU_ZONE_START + 16, 48);
      state.towers.forEach(drawTower);
      state.playerUnits.forEach(drawUnit);
      state.cpuUnits.forEach(drawUnit);
      state.bullets.forEach(drawBullet);
    }

    function loop(timestamp) {
      const delta = lastTimestamp ? timestamp - lastTimestamp : 16;
      lastTimestamp = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    populateUnitBox();
    loop();
  </script>
</body>
</html>
